title: Mel Mazzeo · Hacedores de Marca™
description: "Acompaño a ex corporativos 40+ que no quieren volver al corporativo a hacer que su independencia funcione, alrededor de su propio nombre. Sin depender de nadie."
url: "https://www.melmazzeo.com"
lang: es_UY

# Cómo se arman las URLs de cada artículo. Con esto, un post con
# título "Por qué el boca a boca no alcanza" queda en:
# melmazzeo.com/blog/por-que-el-boca-a-boca-no-alcanza/
permalink: /blog/:title/

markdown: kramdown

# Plugins soportados de forma nativa por GitHub Pages.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Datos que usa jekyll-seo-tag como default en cada página/post
author: Mel Mazzeo
image: /assets/og-image.jpg
twitter:
  username: melmazzeo
social:
  name: Mel Mazzeo
  links:
    - https://instagram.com/melmazzeo
    - https://www.linkedin.com/in/melmazzeo
    - https://tiktok.com/@mel.mazzeo
    - https://youtube.com/@melmazzeo

# Todo artículo usa el diseño "post" sin tener que escribirlo
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Archivos que Jekyll no debe procesar ni subir al build
exclude:
  - README.md
  - INSTRUCCIONES.md
  - Gemfile
  - Gemfile.lock
